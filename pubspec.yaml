name: wankaner_go
description: "Your City. Your Shops. One App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & Routing
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  
  # Networking
  http: ^1.2.0
  
  # UI & Styling
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  badges: ^3.1.2
  intl: ^0.20.2
  url_launcher: ^6.2.4
  
  # Utilities
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  image_picker: ^1.2.3
  geolocator: ^12.0.0
  flutter_local_notifications: ^22.3.1
  permission_handler: ^13.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  qr_flutter: ^4.1.0
  timeago: ^3.7.1
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/app_icon.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/app_icon.jpg
  android: true
  ios: true
  web: false
